<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17151c">
  <title>ScreenTime — Discover movies</title>
  <meta name="description" content="Browse movies and explore available cinema showtimes.">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./config.js"></script>
  <script defer src="./script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./index.html" aria-label="ScreenTime home"><span class="brand-mark">S</span> ScreenTime</a>
      <nav class="main-nav" aria-label="Main navigation">
        <a class="active" href="./index.html">Movies</a>
        <a href="#now-showing">Now showing</a>
      </nav>
      <form class="search-form" id="movieSearch" role="search">
        <label class="sr-only" for="searchInput">Search movies</label>
        <input id="searchInput" type="search" placeholder="Search movies…" autocomplete="off">
        <button type="submit" aria-label="Search">Search</button>
      </form>
    </div>
  </header>

  <main class="page-shell" id="now-showing">
    <section class="hero">
      <p class="eyebrow">YOUR NEXT BIG SCREEN MOMENT</p>
      <h1>Movies worth <span>watching.</span></h1>
      <p class="hero-copy">Find a story, pick a show, and make it a movie night.</p>
    </section>

    <section class="section-heading">
      <div>
        <p class="eyebrow">CURATED FOR YOU</p>
        <h2>Now showing</h2>
      </div>
      <p class="result-count" id="resultCount" aria-live="polite"></p>
    </section>

    <div id="movieStatus" class="status-panel" role="status" aria-live="polite">Loading movies…</div>
    <section id="movieCards" class="movie-grid" aria-label="Available movies"></section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <a class="brand" href="./index.html"><span class="brand-mark">S</span> ScreenTime</a>
      <p>An independent movie-booking learning project. Not affiliated with BookMyShow.</p>
    </div>
  </footer>
</body>
</html>
