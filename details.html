<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17151c">
  <title>Movie details — ScreenTime</title>
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./config.js"></script>
  <script defer src="./detail-script.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="./index.html"><span class="brand-mark">S</span> ScreenTime</a>
      <nav class="main-nav" aria-label="Main navigation"><a href="./index.html">← All movies</a></nav>
    </div>
  </header>

  <main class="page-shell detail-shell">
    <div id="detailStatus" class="status-panel" role="status" aria-live="polite">Loading movie details…</div>
    <section id="movieDetails" aria-label="Movie details"></section>
    <section class="showtime-section" aria-labelledby="showtimeTitle">
      <div class="section-heading">
        <div><p class="eyebrow">PLAN YOUR VISIT</p><h2 id="showtimeTitle">Available showtimes</h2></div>
      </div>
      <div id="showtimes" class="showtime-list"></div>
    </section>
  </main>

  <dialog id="bookingDialog" class="booking-dialog" aria-labelledby="bookingTitle">
    <form id="bookingForm" class="booking-form">
      <div class="dialog-heading">
        <div><p class="eyebrow">JUST A FEW DETAILS</p><h2 id="bookingTitle">Book your seats</h2></div>
        <button type="button" class="icon-button" id="closeBooking" aria-label="Close booking form">×</button>
      </div>
      <p id="selectedShow" class="selected-show"></p>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text" minlength="2" maxlength="100" autocomplete="name" required>
      <label for="email">Email address</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="email" required>
      <label for="phoneNumber">Phone number</label>
      <input id="phoneNumber" name="phoneNumber" type="tel" minlength="8" maxlength="20" autocomplete="tel" pattern="[+0-9() -]{8,20}" required>
      <label for="seatCount">Number of seats</label>
      <input id="seatCount" name="seatCount" type="number" min="1" max="10" value="1" required>
      <p id="bookingStatus" class="form-status" role="status" aria-live="polite"></p>
      <button type="submit" id="submitBooking" class="primary-button">Confirm booking</button>
      <p class="fine-print">Demo booking only. No payment will be collected.</p>
    </form>
  </dialog>

  <footer class="site-footer"><div class="footer-inner"><a class="brand" href="./index.html"><span class="brand-mark">S</span> ScreenTime</a><p>Independent educational prototype. Not affiliated with BookMyShow.</p></div></footer>
</body>
</html>
